<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV BAR USING FLEXBOX-ULTRAEDIT</title>
    <style>
        .box {
            height: 80px;
            width: 1000px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgb(173, 171, 171);
        }



        .name {
            font-size: 15px;
            font-weight: bold;
            margin-right: 15px;
            width: 100px;
            margin-top: 5px;
        }

        .logo {
            font-size: 10px;
            margin-top: 5px;
        }

        .left {
            display: flex;
            align-items: center;

        }

        .box nav ul {
            width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 10px;
        }

        .box nav ul li {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        /* Remove the default dropdown arrow */
        .box nav select {
            border: none;
            background: transparent;
            outline: none;
            font-size: 10px;
            width: auto;
            padding: 0;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
        }

        /* Our own small arrow */
        .dropdown::after {
            content: "⌄";
            font-size: 11px;
            /* margin-left: 3px; */
            line-height: 1;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left">
            <div class="img">
                <img src="UE_logo_icon_white.png" alt="UltraEdit Logo" width="40px">
            </div>
            <div class="name">UltraEdit

                <div class="logo">
                    By embercerado
                </div>
            </div>
        </div>
        <nav>
            <ul>
                <li class="dropdown">
                <select name="Products">
                    <option value="Products">Products</option>
                    <option value="UltraEdit">UltraEdit</option>
                    <option value="UltraCompare">UltraCompare</option>
                    <option value="UltraFinder">UltraFinder</option>
                    <option value="UltraFTP">UltraFTP</option>
                    <option value="UltraSentry">UltraSentry</option>
                    <option value="UltraEdit Suite">UltraEdit Suite</option>
                    <option value="UltraEdit for Mac">UltraEdit for Mac</option>
                </select>
                </li>
                <li>Buy</li>
                <li>Renew</li>
                <li class="dropdown">
                    <select name="Learn">
                        <option value="Learn">Learn</option>
                        <option value="Blog">Blog</option>
                        <option value="Webinars">Webinars</option>
                        <option value="Video Tutorials">Video Tutorials</option>
                        <option value="User Guide">User Guide</option>
                    </select>
                </li>

                <li class="dropdown">
                    <select name="Company">
                        <option value="Company">Company</option>
                        <option value="About Us">About Us</option>
                        <option value="Careers">Careers</option>
                        <option value="Press Releases">Press Releases</option>
                        <option value="Contact Us">Contact Us</option>
                    </select>
                </li>
                <li>
                    <select name="Support">
                        <option value="Support">Support</option>
                        <option value="Contact Support">Contact Support</option>
                        <option value="Knowledge Base">Knowledge Base</option>
                        <option value="Product Documentation">Product Documentation</option>
                        <option value="License Management">License Management</option>
                        <option value="Software Updates">Software Updates</option>
                    </select>

                </li>
                
            </ul>
        </nav>
        <div class="download">
            <button>Download</button>
        </div>
        <div class="english">
            <select name="English">
                <option value="English">English</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Italian">Italian</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Russian">Russian</option>
            </select>
        </div>
        <div class="search">
            <input type="text" placeholder="Search">
            <button>Search</button>
        </div>
    </div>

</body>

</html>
