<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows And Outlines</title>
        <style>
            *{
                margin:3px;
                padding:5px;
            }
            .box{
                border: 2px solid black;
                box-shadow: 2px 2px 2px red;
                
            }
            .text{
                outline: 4px solid green;
                text-shadow: 5px 5px 5px rgb(192, 43, 68);
            }
        </style>
</head>
<body>
    <div class="box">
         I AM A BOX
    </div>
    <div class="text">
        I AM A TEXT
    </div>
    
</body>
</html>
