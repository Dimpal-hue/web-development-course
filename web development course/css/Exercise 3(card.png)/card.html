<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CARD</title>
    <style>
        body{
            background-color: black;
            padding:100px 50px 0 500px;
        }
        .card{
            border:340px;
            height:344px;
            width:250px;
            background-color:white;
            border-radius: 7px;
            

        }
        .image{
            padding:5px;
        }
        .image img{
            border-radius: 7px;
        }
        .capsule{
            padding:0 5px;
            margin:5px;

        }
        .capsule span{
            border: 1px solid rgb(128, 128, 219);
            border-radius:8px;
            font-size:12px;
            padding:0 6px;
            color:rgb(170, 220, 245)

        }
        .content{
            padding: 5px;
        }

        .content h1{
            
            font-size:20px;
        }
        .content p{
            color:rgba(35, 34, 34, 0.24)
        }
        .more{
            
            border:2px;
            text-align: center;
            padding:2px;
            

        }
        .more span{
            
            border:1px solid rgb(229, 239, 245);
            border-radius:20px;
            color:rgb(77, 166, 198);
            padding:10px;
            background-color: rgb(198, 212, 217);
            font-size:10px;
            cursor:pointer;

            
            
        }
        .more span:hover{
            background-color: rgb(246, 244, 244);
        }
      
    </style>
  </head>
  <body>
    <div class="card">
        <div class="image">
            <img width="240"src="images.jpg
            " alt="card deisgn">
        </div>
        <div class="capsule">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h1>CARD DESIGN</h1>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ea hic error velit eos sed suscipit!</p>
        </div>
        <div class="more">
            <span>Read More</span>
        </div>


    </div>
  </body>
</html>
