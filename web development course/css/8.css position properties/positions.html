<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            position:absolute;
            height:1000px;
            width:900px;
            border:5px solid purple;
            text-transform: capitalize;

        }
        .box1{
            position:sticky;
            top:0px;
            left:0px;
            height: 120px;
            width: 820px;
            background-color: blue;
        }
        .box2{
            height: 220px;
            width: 820px;
            background-color: aqua;
        }
        .box3{
            height: 220px;
            width: 820px;
            background-color: blueviolet;
        }
        .box4{
            position:fixed;
            bottom:0px;
            right:0px;
            background-color: brown;
            height: 110px;
            width: 820px;


        }
        /* .box5{
            position:sticky;
            height: 300px;
            width: 150px;
            height: px;
            width: 820px;
            background-color: black;
            top:0px;

        } */
    </style>
</head>
<body>
    <div class="parent">
        <div class="box1">This Works As A Nav Bar</div>
        <div class="box2">this is box2</div>
        <div class="box3">this is box 3</div>
        <div class="box4">this is fixed just like an add</div>
        <div class="box5"></div>
    </div>
    
</body>
</html>
