<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal css</title>
    <style>
        div{
            color:brown;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div>
        <ol>
            <li>
                this is internal css 
            </li>
        </ol>
    </div>
    <div>
        and internal css will be apply to all descriptors of same category such as div
    </div>
    <span>
        internal css is not defined for span 
    </span>
</body>
</html>
